<html>
    <head>
        <title>
            URL Shortener
        </title>
        <lr>URL SHORTENER</lr>
    </head>
    <body>
        <form id="url_input">
            <label for="url_input_text">Enter URL:</label>
            <input type="text" id ="url_input_text" name = "url_input"><br><br>

            <label for="preference">Enter preference:</label>
            <input type="text" id ="preference" name = "Preferred code:"><br><br>
            <input type="submit" id="submitButton" value="Submit">
        </form>
        <p id="message"></p><br>
        <p>Resultant hash:</p><br>
        <p id = "result"></p>
        <p id = "code"></p>
        <p id = "url"></p>
    </body>
</html>

<script>
    const form = document.getElementById("url_input");

    form.addEventListener("submit", async function(event){
        event.preventDefault();
        const url = document.getElementById("url_input_text").value;
        const preference = document.getElementById("preference").value;
        //console.log(url);

        const response  = await fetch("/submit",{
            method: "POST",
            headers: {
                "Content-type": "application/json"
            },
            body:   JSON.stringify({
                url: url,
                preference: preference
            })
        });

        const data = await response.json();

        document.getElementById("message").textContent = data.message || "";
        document.getElementById("url").textContent = data.url || "";
        document.getElementById("code").textContent = data.code || "";
    });
</script>
