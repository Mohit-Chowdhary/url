<html>
    <head>
        <title>
            URL Shortener
        </title>
        <lr>URL SHORTENER</lr>
    </head>
    <body>
        <form id="urlInput">
            <label for="urlInput">Enter URL:</label>
            <input type="text" id ="urlInputText" name = "urlInput"><br><br>
            <input type="submit" id="submitButton" value="Submit">
        </form>
        <p id="result"></p><br>
        <p>Resultant hash:</p><br>
        <p id = "result"></p>
    </body>
</html>

<script>
    const form = document.getElementById("urlInput");

    form.addEventListener("submit", async function(event){
        event.preventDefault();
        let url = document.getElementById("urlInputText").value;
        //console.log(url);

        const response  = await fetch("/submit",{
            method: "POST",
            headers: {
                "Content-type": "application/json"
            },
            body:   JSON.stringify({
                url: url
            })
        });

        const data = await response.json();

        document.getElementById("result").textContent = data.result;
    });
</script>
